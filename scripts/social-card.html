<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>CikTab 分享封面</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      .site-shell { width: 1200px; height: 630px; min-height: 630px; }
      .main-content { padding: 24px; }
      .follow-content { max-width: 420px; padding: 22px 28px; }
      .account-logo { width: 45px; }
      h1 { font-size: 40px; }
      .account-heading { gap: 10px; }
      .account-description { font-size: 12px; margin-top: 12px; }
      .qr-section { margin-top: 18px; }
      .qr-frame { width: max-content; padding: 12px; }
      .qr-image { width: 174px; height: 174px; }
      .scan-caption { margin-top: 13px; }
      .social-url { position: absolute; bottom: 16px; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 10px; letter-spacing: .3px; }
    </style>
  </head>
  <body>
    <div class="site-shell">
      <div class="page-background" aria-hidden="true"><div class="background-flow background-flow-blue"></div><div class="background-flow background-flow-cool"></div></div>
      <main class="main-content">
        <section class="follow-content">
          <div class="account-intro">
            <div class="account-heading"><span class="account-logo"><img src="/img/logo-mark.svg" alt="CikTab Logo" width="80" height="80" /></span><h1>CikTab<span>.</span></h1></div>
            <p class="account-description">分享技术知识、数字生活，<br />探索技术的边界，记录生活的点滴！</p>
          </div>
          <div class="qr-section">
            <div class="qr-frame"><img class="qr-image" src="/img/wechat-qrcode.jpg" alt="CikTab 微信公众号二维码" width="258" height="258" /></div>
            <p class="scan-caption">微信扫一扫，关注 CikTab</p>
            <div class="account-id-region"><div class="account-id"><span class="id-label">公众号 ID</span><span class="id-value">cikccom</span><span class="id-copy-icon"><svg width="17" height="17" viewBox="0 0 256 256" fill="none" stroke="currentColor" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"><path d="M184 184h32V40H72v32"/><rect x="32" y="72" width="152" height="152" rx="8"/></svg></span></div></div>
          </div>
        </section>
      </main>
      <p class="social-url">wechat.cikcc.com</p>
    </div>
  </body>
</html>
